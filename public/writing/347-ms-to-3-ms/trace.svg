<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="100%" role="img" aria-labelledby="t" style="background:#0d1117">
  <title id="t">production trace of the notifications endpoint: 22.3 ms, 4 SQL queries</title>
  <style>text{font-family:system-ui,-apple-system,sans-serif}.h{fill:#e6edf3;font-size:17px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.k{fill:#9198a1;font-size:13px}.r{fill:#e6edf3;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.v{fill:#9198a1;font-size:13px}</style>
  <text x="40" y="44" class="h">GET /v2/crm/notifications/list</text>
  <text x="960" y="44" class="k" text-anchor="end">22.3 ms, 4 queries</text>
  <rect x="40" y="62" width="920" height="1" fill="#30363d"/>
  <g>
    <text x="40" y="98" class="r">notifications for this user and team, LIMIT 100</text>
    <rect x="640" y="86" width="244" height="16" rx="3" fill="#1D9E75"/><text x="960" y="98" class="v" text-anchor="end">6.1 ms</text>
  </g>
  <g>
    <text x="40" y="148" class="r">view settings, WHERE name IN (...)</text>
    <rect x="640" y="136" width="84" height="16" rx="3" fill="#1D9E75"/><text x="960" y="148" class="v" text-anchor="end">2.1 ms</text>
  </g>
  <g>
    <text x="40" y="198" class="r">sender names, WHERE name IN (...)</text>
    <rect x="640" y="186" width="76" height="16" rx="3" fill="#1D9E75"/><text x="960" y="198" class="v" text-anchor="end">1.9 ms</text>
  </g>
  <g>
    <text x="40" y="248" class="r">target names, WHERE name IN (...)</text>
    <rect x="640" y="236" width="128" height="16" rx="3" fill="#1D9E75"/><text x="960" y="248" class="v" text-anchor="end">3.2 ms</text>
  </g>
  <rect x="40" y="272" width="920" height="1" fill="#30363d"/>
  <text x="40" y="304" class="k">the old version ran about 300 extra queries for the same 100 rows</text>
</svg>
