<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">El Regaldo identity reclaimed as a quiet version two</title>
  <desc id="desc">A sparse hand-drawn scene where a small black character carries the elregaldo.com name out of a locked drawer of old creator evidence toward a new foundation.</desc>
  <defs>
    <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .line {
        fill: none;
        stroke: #111;
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#wobble);
      }

      .thin {
        fill: none;
        stroke: #111;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#wobble);
      }

      .orange {
        fill: none;
        stroke: #e78a20;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#wobble);
      }

      .red {
        fill: none;
        stroke: #d83a32;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#wobble);
      }

      .blue {
        fill: none;
        stroke: #2777bd;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#wobble);
      }

      .note {
        font-family: "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
        font-size: 42px;
        fill: #111;
        letter-spacing: 0;
      }

      .small-note {
        font-family: "Comic Sans MS", "Bradley Hand", "Segoe Print", cursive;
        font-size: 33px;
        fill: #111;
        letter-spacing: 0;
      }

      .orange-text {
        fill: #d97818;
      }

      .red-text {
        fill: #c62f29;
      }

      .blue-text {
        fill: #236fac;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>

  <g transform="translate(0 10)">
    <path class="thin" d="M245 662c94 29 205 41 326 36 92-4 158-15 252-9 107 7 171 34 295 18 82-11 139-35 236-23"/>
    <path class="orange" d="M520 635c95-66 186-88 267-68 83 21 139 78 218 83"/>
    <path class="orange" d="M986 628c30 9 58 6 83-9-15 25-31 43-49 54"/>

    <g transform="rotate(-3 402 438)">
      <rect class="line" x="210" y="301" width="384" height="256" rx="14"/>
      <line class="thin" x1="210" y1="374" x2="594" y2="360"/>
      <line class="thin" x1="266" y1="301" x2="285" y2="368"/>
      <line class="thin" x1="398" y1="296" x2="416" y2="363"/>
      <line class="thin" x1="520" y1="300" x2="539" y2="365"/>
      <rect class="thin" x="260" y="411" width="120" height="78" rx="10"/>
      <path class="thin" d="M411 428h120M410 469h76"/>
      <circle cx="305" cy="444" r="13" fill="#111"/>
      <path class="blue" d="M282 503c22 20 52 29 92 27"/>
      <text class="small-note blue-text" x="244" y="587" transform="rotate(5 244 587)">old channel</text>
    </g>

    <g transform="translate(358 176) rotate(5)">
      <rect class="line" x="0" y="0" width="192" height="284" rx="28"/>
      <rect class="thin" x="23" y="38" width="146" height="202" rx="8"/>
      <circle cx="96" cy="260" r="10" fill="#111"/>
      <path class="thin" d="M52 85c18-20 63-33 102-12"/>
      <path class="thin" d="M48 130h92M48 169h72"/>
      <text class="small-note" x="-38" y="-26" transform="rotate(-7 -38 -26)">phone edits</text>
    </g>

    <g transform="translate(605 331) rotate(-2)">
      <rect class="line" x="0" y="0" width="410" height="128" rx="13" fill="#fff"/>
      <path class="thin" d="M31 85c59-8 119-11 180-8 67 3 120 14 166 9"/>
      <text class="note" x="36" y="59">elregaldo.com</text>
      <path class="red" d="M292 32c17-19 40-28 69-24"/>
      <text class="small-note red-text" x="303" y="-17" transform="rotate(-4 303 -17)">taken back</text>
    </g>

    <g transform="translate(1012 399) rotate(2)">
      <path d="M91 33c54 4 83 42 73 91-6 34-24 57-61 62-44 6-80-15-91-55C0 87 27 29 91 33Z" fill="#111"/>
      <circle cx="66" cy="91" r="8" fill="#fff"/>
      <circle cx="111" cy="89" r="8" fill="#fff"/>
      <path class="thin" d="M38 176c-14 51-17 95-8 133"/>
      <path class="thin" d="M117 179c21 48 24 92 8 134"/>
      <path class="thin" d="M-44 115c-40 33-68 62-86 87"/>
      <path class="thin" d="M151 118c43 13 76 35 99 68"/>
      <path class="thin" d="M-117 200c40 3 76 11 108 25"/>
      <path class="thin" d="M243 184c-40 7-75 19-106 36"/>
    </g>

    <g transform="translate(1090 288) rotate(3)">
      <rect class="line" x="0" y="0" width="285" height="176" rx="18"/>
      <path class="thin" d="M0 56c88 12 179 12 285 0"/>
      <path class="thin" d="M128 93c17-18 37-18 54 0v33h-54z"/>
      <path class="thin" d="M137 93c-2-31 8-49 27-52 21 3 31 21 29 52"/>
      <text class="small-note red-text" x="30" y="222" transform="rotate(-5 30 222)">evidence drawer</text>
    </g>

    <g transform="translate(967 665) rotate(-1)">
      <rect class="thin" x="0" y="0" width="440" height="66" rx="10"/>
      <path class="thin" d="M30 35h98M167 35h86M293 35h106"/>
      <path class="blue" d="M42 89c95 14 216 18 353 4"/>
      <text class="small-note blue-text" x="51" y="141" transform="rotate(2 51 141)">version two foundation</text>
    </g>

    <g transform="translate(604 617) rotate(-6)">
      <path class="red" d="M0 18c44-14 91-18 141-13"/>
      <text class="small-note red-text" x="0" y="64">identity, not footage</text>
    </g>

    <g transform="translate(700 186) rotate(-8)">
      <path class="blue" d="M0 44c36-27 85-42 147-44"/>
      <text class="small-note blue-text" x="0" y="87">the name stayed</text>
    </g>
  </g>
</svg>
