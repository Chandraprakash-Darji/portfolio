<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" role="img" aria-labelledby="s" style="background:#0d1117">
  <title id="s">API server time before and after the move</title>
  <style>text{font-family:system-ui,-apple-system,sans-serif}.r{fill:#e6edf3;font-size:15px;font-weight:600}.v{fill:#9198a1;font-size:13px}.k{fill:#9198a1;font-size:13px}</style>
  <rect x="40" y="22" width="14" height="14" rx="2" fill="#888780"/><text x="62" y="34" class="k">old python backend</text>
  <rect x="220" y="22" width="14" height="14" rx="2" fill="#1D9E75"/><text x="242" y="34" class="k">typescript on brick</text>
  <text x="960" y="34" class="k" text-anchor="end">server time, ms</text>
  <g>
    <text x="40" y="92" class="r">median</text>
    <rect x="250" y="72" width="214" height="18" rx="3" fill="#888780"/><text x="472" y="86" class="v">347</text>
    <rect x="250" y="94" width="4" height="18" rx="2" fill="#1D9E75"/><text x="262" y="108" class="v">6.9</text>
  </g>
  <g>
    <text x="40" y="170" class="r">p95</text>
    <rect x="250" y="150" width="700" height="18" rx="3" fill="#888780"/><text x="950" y="164" class="v" text-anchor="end" style="fill:#0d1117">1,134</text>
    <rect x="250" y="172" width="71" height="18" rx="3" fill="#1D9E75"/><text x="329" y="186" class="v">115</text>
  </g>
  <g>
    <text x="40" y="248" class="r">onboarding status</text>
    <rect x="250" y="228" width="525" height="18" rx="3" fill="#888780"/><text x="783" y="242" class="v">851</text>
    <rect x="250" y="250" width="5" height="18" rx="2" fill="#1D9E75"/><text x="263" y="264" class="v">8.8</text>
  </g>
  <g>
    <text x="40" y="326" class="r">activation stats</text>
    <rect x="250" y="306" width="436" height="18" rx="3" fill="#888780"/><text x="694" y="320" class="v">707</text>
    <rect x="250" y="328" width="9" height="18" rx="2" fill="#1D9E75"/><text x="267" y="342" class="v">14</text>
  </g>
</svg>
